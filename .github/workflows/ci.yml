name: pipeline-qc
on: [push, pull_request]
jobs:
  build-test-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '4.3.3', use-public-rspm: true }
      - name: Install packages
        run: Rscript -e 'install.packages(c("dplyr","tidyr","purrr","tibble","ggplot2","plotly","shiny","testthat","yaml","jsonlite","scales"))'
      - name: Unit + integration tests (incl. seeded-error detection)
        run: Rscript tests/testthat.R
      - name: Run pipeline (non-zero exit if QC compare or integrity checks fail)
        run: Rscript run_pipeline.R --regen
      - name: Archive outputs and audit trail
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            output/study_summary.md
            output/figures
            output/qc
            output/run_manifest.csv
            output/run_log.txt
            output/session_info.txt
